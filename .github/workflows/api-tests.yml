name: API Tests

# CI for the apps/api test suite. Mirrors the AI Knowledge Layer job's safe
# patterns: runs on every PR and on pushes to main, least-privilege (read-only),
# no secrets, no deploy. The suite uses in-memory SQLite (aiosqlite) + fakeredis,
# so NO database/redis service is required. It exercises app code read-only and
# performs no external writes.
#
# Import note: apps/api/pytest.ini sets import-mode=importlib and apps/api/conftest.py
# adds repo-root + scanner/ to sys.path, so a plain `pytest apps/api/tests` works
# (avoids the apps/api/platform vs stdlib `platform` shadow). scanner/ is on the
# path for `webhound.*` imports, so scanner runtime deps are installed too.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read   # least privilege; no write, no secrets, no deploy

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API test deps (api dev reqs + scanner runtime deps for webhound)
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements-dev.txt
          pip install -r scanner/requirements.txt

      - name: Run API tests (apps/api/tests — bare invocation, config-driven)
        run: python -m pytest apps/api/tests -q -ra

  # CONTROL-2D: gate dense HYBRID retrieval QUALITY (not just the build/fallback
  # contract). Installs sentence-transformers, regenerates the canonical chunk set,
  # builds a small CONCEPT-SEEDED shard (all 10 concept modules + a bounded sample),
  # and asserts >=8/10 concepts are found (top-k, rank-robust) under hybrid.
  # Read-only, no secrets, no deploy. Independent of the minimal ai-knowledge job
  # (which has no sentence-transformers and stays green via contract/fallback tests).
  dense-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dense retrieval deps (local model; no cloud APIs)
        run: |
          python -m pip install --upgrade pip
          pip install sentence-transformers numpy
      - name: Build canonical chunk set (code + docs)
        run: python scripts/ai/build_canonical_brain_index.py
      - name: Build concept-seeded CI shard
        run: python scripts/ai/build_dense_brain_embeddings.py --seed-modules CI --sample 1200 --output-dir corpus/index/_ci_shard
      - name: Gate hybrid traceability (>=8/10 concepts found, top-k)
        run: python scripts/ai/check_brain_traceability.py --index-dir corpus/index/_ci_shard --mode hybrid --min-found 8
