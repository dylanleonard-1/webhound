[pytest]
# Test-harness config for the apps/api suite ONLY (no app/source behavior changes).
#
# Why this file exists:
#   * apps/api/ contains a first-party package `apps/api/platform/`. Under pytest's
#     default "prepend" import mode, pytest inserts apps/api onto sys.path[0], so a
#     bare `import platform` resolves to apps/api/platform instead of the stdlib —
#     which breaks SQLAlchemy's import (platform.python_implementation()). Using
#     import-mode=importlib stops pytest from prepending apps/api to sys.path, so the
#     stdlib `platform` wins again. The app package is still reachable as the
#     fully-qualified apps.api.platform.
#   * The suite imports `apps.api.*` (needs repo root importable) and `webhound.*`
#     (lives in scanner/). Those two paths are added deterministically by the
#     sibling `apps/api/conftest.py` (computed from __file__), which pytest loads
#     before the app test conftest. A plain `pytest apps/api/tests` then works with
#     no manual flags / no PYTHONPATH.
#
# This changes ONLY how tests are collected/imported. No production code is modified.
addopts = --import-mode=importlib
testpaths = tests
