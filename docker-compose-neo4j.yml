version: "3.9"
# WebHound Phase 8C — Neo4j for Graphiti + brain graph storage
# Usage: docker compose -f docker-compose-neo4j.yml up -d
# Then seed: python scripts/ai/load_neo4j.py
# Then seed graphiti: python scripts/ai/seed_graphiti.py --live

services:
  neo4j:
    image: neo4j:5.26
    container_name: webhound-neo4j
    ports:
      - "7474:7474"   # Browser UI: http://localhost:7474
      - "7687:7687"   # Bolt (used by Graphiti + load_neo4j.py)
    environment:
      NEO4J_AUTH: "neo4j/webhound-brain-local"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
