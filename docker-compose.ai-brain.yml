# WebHound AI Brain — Local Development Infrastructure
# =====================================================
# LOCAL DEV ONLY — DO NOT USE IN PRODUCTION
# This file starts Neo4j and Ollama for local brain runtime testing.
#
# Usage:
#   Start:  docker compose -f docker-compose.ai-brain.yml up -d
#   Stop:   docker compose -f docker-compose.ai-brain.yml down
#   Logs:   docker compose -f docker-compose.ai-brain.yml logs -f
#   Status: docker compose -f docker-compose.ai-brain.yml ps
#
# After starting:
#   Load knowledge graph:   python scripts/ai/load_neo4j.py
#   Load brain graph:       python scripts/ai/load_brain_graph_neo4j.py
#   Pull Ollama model:      docker exec webhound-ollama-dev ollama pull llama3.2
#   Seed Graphiti memories: python scripts/ai/load_graphiti_seed_memories.py --live

version: "3.9"

services:
  # ── Neo4j — knowledge graph for Graphiti ──────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: webhound-neo4j-dev
    ports:
      - "7474:7474"   # Neo4j browser UI: http://localhost:7474
      - "7687:7687"   # Bolt protocol (Graphiti + load scripts)
    environment:
      # LOCAL DEV ONLY — change this password before any non-local use
      NEO4J_AUTH: "neo4j/webhound-brain-local-dev"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1G"
    volumes:
      - neo4j_data:/data        # LOCAL DEV ONLY — gitignored
      - neo4j_logs:/logs        # LOCAL DEV ONLY — gitignored
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s
    restart: unless-stopped

  # ── Ollama — local LLM for Graphiti + LightRAG graph extraction ───────────
  ollama:
    image: ollama/ollama:latest
    container_name: webhound-ollama-dev
    ports:
      - "11434:11434"   # Ollama REST API (OpenAI-compatible at /v1)
    volumes:
      - ollama_models:/root/.ollama   # LOCAL DEV ONLY — gitignored (~4GB per model)
    environment:
      OLLAMA_HOST: "0.0.0.0"
    # Models are NOT pre-pulled here — pull manually after start:
    #   docker exec webhound-ollama-dev ollama pull llama3.2
    #   docker exec webhound-ollama-dev ollama pull nomic-embed-text
    restart: unless-stopped

volumes:
  neo4j_data:
    # LOCAL DEV ONLY — never commit, never deploy
  neo4j_logs:
    # LOCAL DEV ONLY — never commit, never deploy
  ollama_models:
    # LOCAL DEV ONLY — stores downloaded LLM weights (~4GB+)
