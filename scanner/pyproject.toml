[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webhound"
version = "0.1.0"
description = "WebHound — production-grade website security scanner"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "dnspython>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-anyio"]

[tool.setuptools.packages.find]
where = ["."]
include = ["webhound*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
